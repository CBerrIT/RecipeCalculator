<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Calorie Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fffdf8;
    --ink: #1a1208;
    --ink-light: #5c4f38;
    --accent: #c84b11;
    --accent-light: #f9ede5;
    --green: #2d6a4f;
    --green-light: #e8f4ee;
    --border: #d6c9b0;
    --mono: 'DM Mono', monospace;
    --serif: 'Fraunces', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    margin-bottom: 40px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
  }

  header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  header h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }

  header p {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Table wrapper */
  .table-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 2px;
    box-shadow: 4px 4px 0 var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: var(--ink);
    color: #f5f0e8;
  }

  thead th {
    padding: 12px 14px;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    text-align: left;
  }

  thead th:not(:first-child) { text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf6ef; }

  tbody td {
    padding: 0;
  }

  /* Row number */
  .row-num {
    width: 32px;
    text-align: center;
    font-size: 0.65rem;
    color: var(--border);
    padding: 0 4px;
    user-select: none;
    vertical-align: middle;
  }

  /* Inputs */
  td input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink);
    padding: 11px 14px;
    outline: none;
    transition: background 0.15s;
  }

  td input:focus {
    background: var(--accent-light);
  }

  td input[type="number"] {
    text-align: center;
    -moz-appearance: textfield;
  }

  td input[type="number"]::-webkit-outer-spin-button,
  td input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  td input::placeholder { color: var(--border); }

  /* Cal/g display */
  .calg-cell {
    text-align: center;
    padding: 11px 14px;
    font-size: 0.85rem;
    color: var(--green);
    font-weight: 500;
    min-width: 80px;
  }

  /* Totals row */
  .totals-wrap {
    background: var(--green);
    color: #fff;
    border: 1.5px solid var(--green);
    border-radius: 2px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    margin-bottom: 36px;
    box-shadow: 4px 4px 0 #1a3d2b;
    overflow: hidden;
  }

  .totals-wrap .t-cell {
    padding: 14px 18px;
    border-right: 1px solid rgba(255,255,255,0.15);
  }

  .totals-wrap .t-cell:last-child { border-right: none; }

  .t-label {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .t-value {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1;
  }

  /* Portion calculator */
  .portion-section {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 28px 32px;
    box-shadow: 4px 4px 0 var(--border);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: center;
  }

  .portion-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 8px;
  }

  .portion-input-wrap {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    overflow: hidden;
  }

  .portion-input-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 600;
    color: var(--ink);
    padding: 10px 16px;
    outline: none;
    width: 100px;
    text-align: center;
    -moz-appearance: textfield;
  }

  .portion-input-wrap input::-webkit-outer-spin-button,
  .portion-input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .portion-unit {
    padding: 0 14px;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    border-left: 1.5px solid var(--border);
    background: var(--bg);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .arrow-icon {
    font-size: 1.5rem;
    color: var(--border);
    text-align: center;
  }

  .result-display {
    text-align: right;
  }

  .result-number {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
    display: block;
  }

  .result-unit {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-top: 4px;
  }

  /* Add row btn */
  .add-btn {
    display: block;
    width: 100%;
    margin: 6px 0 24px;
    padding: 10px;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
  }

  .add-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-light);
  }

  /* Clear btn */
  .clear-btn {
    float: right;
    margin-top: -8px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  /* Responsive */
  @media (max-width: 560px) {
    .portion-section {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .result-display { text-align: center; }
    .arrow-icon { transform: rotate(90deg); }
    .totals-wrap { grid-template-columns: 1fr 1fr; }
    thead th.hide-sm, tbody td.hide-sm { display: none; }
  }

  /* Fade-in */
  .container > * {
    animation: fadeUp 0.4s ease both;
  }
  .container > *:nth-child(2) { animation-delay: 0.05s; }
  .container > *:nth-child(3) { animation-delay: 0.1s; }
  .container > *:nth-child(4) { animation-delay: 0.15s; }
  .container > *:nth-child(5) { animation-delay: 0.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-number {
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .result-number.pop {
    transform: scale(1.06);
    color: var(--green);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Recipe <em>Calorie</em> Calculator</h1>
    <p>Enter ingredients · get calories per gram · calculate any portion</p>
  </header>

  <div class="section-header">
    <span class="section-title">Ingredients</span>
    <button class="clear-btn" onclick="clearAll()">Clear all</button>
  </div>

  <div class="table-wrap">
    <table id="ingTable">
      <thead>
        <tr>
          <th style="width:32px"></th>
          <th>Ingredient</th>
          <th style="width:110px">Weight (g)</th>
          <th style="width:120px">Calories (kcal)</th>
          <th style="width:90px" class="hide-sm">Cal / g</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <button class="add-btn" onclick="addRow()">+ Add row</button>

  <div class="totals-wrap">
    <div class="t-cell">
      <div class="t-label">Total weight</div>
      <div class="t-value" id="totalWeight">—</div>
    </div>
    <div class="t-cell">
      <div class="t-label">Total calories</div>
      <div class="t-value" id="totalCals">—</div>
    </div>
    <div class="t-cell">
      <div class="t-label">Cal / gram</div>
      <div class="t-value" id="totalCalG">—</div>
    </div>
    <div class="t-cell">
      <div class="t-label">Ingredients</div>
      <div class="t-value" id="totalRows">0</div>
    </div>
  </div>

  <div class="portion-section">
    <div>
      <div class="portion-label">Portion size</div>
      <div class="portion-input-wrap">
        <input type="number" id="portionG" value="7" min="0" step="0.1" oninput="recalc()">
        <span class="portion-unit">g</span>
      </div>
    </div>
    <div class="arrow-icon">→</div>
    <div class="result-display">
      <div class="portion-label">Calories in portion</div>
      <span class="result-number" id="portionResult">—</span>
      <div class="result-unit">kcal</div>
    </div>
  </div>
</div>

<script>
  const NUM_ROWS = 25;
  const tbody = document.getElementById('tbody');

  function makeRow(i, name='', weight='', cals='') {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="row-num">${i}</td>
      <td><input type="text" placeholder="Ingredient name" value="${name}" oninput="recalc()"></td>
      <td><input type="number" placeholder="0" min="0" step="0.1" value="${weight}" oninput="recalc()"></td>
      <td><input type="number" placeholder="0" min="0" step="0.1" value="${cals}" oninput="recalc()"></td>
      <td class="calg-cell hide-sm" id="calg-${i}">—</td>
    `;
    return tr;
  }

  // Init 25 rows with examples in first 3
  const examples = [
    ['Sugar', 10, 29],
    ['Flour', 30, 50],
    ['Butter', 15, 50],
  ];
  for (let i = 1; i <= NUM_ROWS; i++) {
    const ex = examples[i-1] || [];
    tbody.appendChild(makeRow(i, ex[0]||'', ex[1]||'', ex[2]||''));
  }

  function addRow() {
    const count = tbody.rows.length + 1;
    tbody.appendChild(makeRow(count));
    tbody.lastElementChild.querySelector('input').focus();
    recalc();
  }

  function clearAll() {
    tbody.querySelectorAll('input').forEach(i => i.value = '');
    recalc();
  }

  function recalc() {
    const rows = tbody.querySelectorAll('tr');
    let totalW = 0, totalC = 0, filled = 0;

    rows.forEach((row, idx) => {
      const inputs = row.querySelectorAll('input[type="number"]');
      const w = parseFloat(inputs[0].value) || 0;
      const c = parseFloat(inputs[1].value) || 0;
      totalW += w;
      totalC += c;
      if (w > 0 || c > 0) filled++;

      const calgCell = row.querySelector('.calg-cell');
      if (calgCell) {
        calgCell.textContent = (w > 0 && c > 0) ? (c / w).toFixed(2) : '—';
      }
    });

    const calG = totalW > 0 ? totalC / totalW : 0;

    document.getElementById('totalWeight').textContent = totalW > 0 ? totalW.toFixed(1) + 'g' : '—';
    document.getElementById('totalCals').textContent = totalC > 0 ? totalC.toFixed(0) : '—';
    document.getElementById('totalCalG').textContent = calG > 0 ? calG.toFixed(2) : '—';
    document.getElementById('totalRows').textContent = filled;

    const portion = parseFloat(document.getElementById('portionG').value) || 0;
    const result = document.getElementById('portionResult');
    if (portion > 0 && calG > 0) {
      const newVal = (portion * calG).toFixed(1);
      if (result.textContent !== newVal) {
        result.textContent = newVal;
        result.classList.remove('pop');
        void result.offsetWidth;
        result.classList.add('pop');
        setTimeout(() => result.classList.remove('pop'), 200);
      }
    } else {
      result.textContent = '—';
    }
  }

  recalc();
</script>
</body>
</html>
